services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_PAGE_URL: "https://www.curseforge.com/minecraft/modpacks/submerged-2"
      CF_API_KEY: ${CF_API_KEY}
      MEMORY: "8192M"
      MOTD: "Seaopolis Submerged 2 - Don't drown"
      ENABLE_COMMAND_BLOCK: "true"
      SIMULATION_DISTANCE: "8"
      VIEW_DISTANCE: "8"
      SEED: "butts"
      LEVEL: "catbug"
      OPS: |-
        UncleCeiling
        proXfizzy
      ALLOW_FLIGHT: "true"
      MAX_WORLD_SIZE: "5000"
    volumes:
      - "./data:/data"
    restart: unless-stopped
